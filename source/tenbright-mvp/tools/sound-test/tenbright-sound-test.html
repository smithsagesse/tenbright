<script>
const st=document.getElementById('st'); let ctx;
document.getElementById('chime').onclick=async()=>{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.15);

const play=(id,other)=>async()=>{document.getElementById(other).pause();const a=document.getElementById(id);a.currentTime=0;try{await a.play();st.textContent='Playing ('+Math.round(a.duration)+' seconds). If you hear nothing, the sound is stopped on the laptop or in Chrome.';}catch(e){st.textContent='Chrome blocked the sound: '+e.message;}};
